# Sandbox for the coding agents (triage, developer, debugger, reviewer, release).
# Deny-by-default network: GitHub + package registries only.
# The base image is Ubuntu 24.04 with PHP 8.3; `packages.apt` can't add a PPA, so the agents
# run scripts/sandbox-php.sh to get PHP 8.4 (composer.lock needs it).
# Edit, then `make ai-plan` (dry run) and `make ai-apply`.
name: fugazibyus-sandbox
description: Locked-down container with Composer, Node and the GitHub CLI for working on the FugaziByUs repo. PHP 8.4 comes from scripts/sandbox-php.sh.
config:
    type: cloud
    networking:
        type: limited
        allow_package_managers: true
        allow_mcp_servers: false
        allowed_hosts:
            - github.com
            - api.github.com
            - codeload.github.com
            - objects.githubusercontent.com
            - '*.githubusercontent.com'
            # ondrej/php PPA for PHP 8.4 (scripts/sandbox-php.sh). Ubuntu 24.04 only ships 8.3,
            # and the package-manager allowance only covers ppa.launchpad.net, which has no HTTPS.
            - ppa.launchpadcontent.net
            - packagist.org
            - repo.packagist.org
    packages:
        apt:
            - gh
            - unzip
            - sqlite3
            - composer
metadata:
    project: fugazibyus
