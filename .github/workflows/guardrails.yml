# Guardrails – branch naming, allowed base branches, and protected paths for AI branches.
# Required by the branch rules on main and develop.
name: Guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Collect changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'list<<EOF'
            gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Check guardrails
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          CHANGED_FILES: ${{ steps.files.outputs.list }}
        run: .github/scripts/guardrails.sh
